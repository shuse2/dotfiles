# set Zsh as your default Tmux shell
set-option -g default-shell /bin/zsh

# Set defualt terminal as xterm
set -g default-terminal "tmux-256color"

# Pass modified keys (e.g. Shift+Enter) through to apps like Claude Code.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'xterm-ghostty:extkeys'

# Binding
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# symbols to split the screen
bind | split-window -h
bind - split-window -v

# status bar
set -g status-bg colour243
set -g status-fg black
# enable activity alerts
setw -g monitor-activity on
set -g visual-activity on
# Center the window list
set -g status-justify centre
# Scrollback/History limit
set -g history-limit 4096

set -g @fpp-key 'm'
set -g @yank_selection 'clipboard'

# smart pane switching with awareness of vim splits.
# -F checks the format inside tmux, so no shell starts on each key press.
is_vim="#{m/r:^(n?vim?|view)$,#{pane_current_command}}"
bind -n C-h if -F "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if -F "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if -F "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if -F "$is_vim" "send-keys C-l" "select-pane -R"

# use the mouse
set -g mouse on

# vi is good
set-window-option -g mode-keys vi

# https://github.com/tmux/tmux/issues/543 -copy issue
# set -g default-shell $SHELL
# set -g default-command "reattach-to-user-namespace -l ${SHELL}"

# Artifically introduce some vim mappings
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection -x
bind-key -T copy-mode-vi Escape send -X cancel

# Tmux show if prefix is activated
set -g status-right '#{prefix_highlight} | %a %Y-%m-%d %H:%M'

# List of plugins
# Supports `github_username/repo` or full git repo URLs
set -g @tpm_plugins '              \
  tmux-plugins/tpm                 \
  tmux-plugins/tmux-sensible       \
  tmux-plugins/tmux-yank           \
  jbnicolai/tmux-fpp               \
  tmux-plugins/tmux-resurrect      \
  tmux-plugins/tmux-prefix-highlight \
'
# Other examples:
# github_username/plugin_name    \
# git@github.com/user/plugin     \
# git@bitbucket.com/user/plugin  \

# tmux-agents from the local checkout, so edits load on prefix+r.
run-shell '~/Projects/tmux-agents/agents.tmux'

# Initializes TMUX plugin manager.
# Keep this line at the very bottom of tmux.conf.
run-shell '~/.tmux/plugins/tpm/tpm'
